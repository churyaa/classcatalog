<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ page_title }}</title>
  <meta name="description" content="{{ meta_description }}">
  <link rel="icon" type="image/svg+xml" href="/static/classcatalog_outline_cc_logo_v5.svg">
  <link rel="shortcut icon" href="/static/classcatalog_outline_cc_logo_v5.svg">
  <script>
    (() => {
      const cookieName = "classcatalog_theme";
      const encodedName = `${encodeURIComponent(cookieName)}=`;
      const match = document.cookie
        .split(";")
        .map((part) => part.trim())
        .find((part) => part.startsWith(encodedName));
      let savedTheme = "";
      if (match) {
        try { savedTheme = decodeURIComponent(match.slice(encodedName.length)); } catch (_error) {}
      }
      if (!savedTheme) {
        try {
          savedTheme = localStorage.getItem("classcatalog_theme_v1") || "";
          if (savedTheme) {
            let cookie = `${encodedName}${encodeURIComponent(savedTheme)}; Path=/; Max-Age=${60 * 60 * 24 * 365}; SameSite=Lax`;
            if (window.location.protocol === "https:") cookie += "; Secure";
            document.cookie = cookie;
            localStorage.removeItem("classcatalog_theme_v1");
          }
        } catch (_error) {}
      }
      if (savedTheme) document.documentElement.dataset.theme = savedTheme;
    })();
  </script>
  <link rel="stylesheet" href="/static/styles.css?v=60&amp;header=3&amp;filters=4&amp;themes=10&amp;brandalign=2&amp;admintheme=1&amp;themrail=1&amp;library=3&amp;filterpopout=1&amp;daystates=1">
  <link rel="stylesheet" href="/static/seo.css?v=3">
  <meta name="classcatalog-google-analytics-id" content="G-Y9SSE53RE6">
  <link rel="stylesheet" href="/static/cookie-consent.css?v=1">
  <link rel="canonical" href="{{ canonical_url }}">
  <meta name="robots" content="index,follow">
  <meta property="og:site_name" content="ClassCatalog">
  <meta property="og:locale" content="en_US">
  <meta property="og:type" content="website">
  <meta property="og:title" content="{{ page_title }}">
  <meta property="og:description" content="{{ meta_description }}">
  <meta property="og:url" content="{{ canonical_url }}">
  <meta name="twitter:card" content="summary">
  <meta name="twitter:title" content="{{ page_title }}">
  <meta name="twitter:description" content="{{ meta_description }}">
  <script type="application/ld+json" id="classcatalog-breadcrumb-schema">{{ schema_json | safe }}</script>
</head>
<body>
  <header class="site-header">
    <div class="site-header-inner">
      <a class="brand-wrap" href="/" aria-label="ClassCatalog home">
        <span class="brand-logo" aria-hidden="true"></span>
        <h1>classcatalog</h1>
      </a>
      <nav class="header-actions" aria-label="Primary navigation">
        <a id="home-nav" class="header-nav-button" href="/" aria-label="Home" title="Home">
          <svg class="header-nav-icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
            <path d="M3.5 10.5 12 3.5l8.5 7"></path>
            <path d="M5.5 9.5V20.5h13V9.5"></path>
            <path d="M9.5 20.5v-6h5v6"></path>
          </svg>
          <span class="header-nav-label">Home</span>
        </a>
        <a id="about-nav" class="header-nav-button" href="/#about" aria-label="About" title="About">
          <svg class="header-nav-icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
            <circle cx="12" cy="12" r="8.5"></circle>
            <path d="M12 10.75v5.5"></path>
            <path d="M12 7.6h.01"></path>
          </svg>
          <span class="header-nav-label">About</span>
        </a>
        <a id="subjects-nav" class="header-nav-button" href="/subjects" aria-label="Subjects" title="Subjects">
          <svg class="header-nav-icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
            <path d="M4 5.5c3 0 5.3.8 8 2.5v11c-2.7-1.7-5-2.5-8-2.5Z"></path>
            <path d="M20 5.5c-3 0-5.3.8-8 2.5v11c2.7-1.7 5-2.5 8-2.5Z"></path>
          </svg>
          <span class="header-nav-label">Subjects</span>
        </a>
        <a id="favorites-nav" class="header-nav-button" href="/#favorites" aria-label="Favorites" title="Favorites">
          <svg class="header-nav-icon header-nav-favorite-icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
            <path d="m12 3.4 2.62 5.31 5.86.85-4.24 4.13 1 5.84L12 16.78l-5.24 2.75 1-5.84-4.24-4.13 5.86-.85L12 3.4Z"></path>
          </svg>
          <span class="header-nav-label">Favorites</span>
          <span id="favorites-count" class="header-nav-count">0</span>
        </a>
      </nav>
    </div>
  </header>

  <main class="seo-page-shell">
    {% block content %}{% endblock %}
  </main>

  <footer class="site-footer">
    <div class="footer-inner">
      <p>Planning aid only. Always verify prerequisites, enrollment rules, meeting details, and seat status with SDSU.</p>
      <a href="/">Home</a>
      <a href="/subjects">Browse Subjects</a>
      <a href="/privacy">Privacy</a>
      <a href="/terms">Terms</a>
    </div>
  </footer>
  <div id="theme-picker" class="theme-picker">
    <button id="theme-picker-toggle" class="theme-picker-toggle" type="button" aria-expanded="false" aria-controls="theme-picker-panel" aria-label="Choose theme" title="Choose theme">
      <span class="theme-toggle-swatches" aria-hidden="true">
        <i class="theme-toggle-dot theme-toggle-background"></i>
        <i class="theme-toggle-dot theme-toggle-accent"></i>
        <i class="theme-toggle-dot theme-toggle-text"></i>
        <i class="theme-toggle-dot theme-toggle-ui"></i>
      </span>
    </button>
    <div id="theme-picker-panel" class="theme-picker-panel" hidden>
      <div class="theme-picker-heading">
        <strong>Theme</strong>
        <span>4-color palettes</span>
      </div>
      <div class="theme-options" role="radiogroup" aria-label="Choose a ClassCatalog theme"></div>
    </div>
  </div>
  <script>
    (() => {
      const badge = document.querySelector("#favorites-count");
      if (!badge) return;
      try {
        const parsed = JSON.parse(window.localStorage.getItem("classcatalog_favorites_v1") || "{}");
        const count = parsed && typeof parsed === "object" && !Array.isArray(parsed)
          ? Object.values(parsed).filter((section) => section && section.course_code && section.schedule_number).length
          : 0;
        badge.textContent = count.toLocaleString();
      } catch (_error) {
        badge.textContent = "0";
      }
    })();
  </script>
  <script src="/static/seo-theme-picker.js?v=1" defer></script>
  <script src="/static/cookie-consent.js?v=1" defer></script>
</body>
</html>
